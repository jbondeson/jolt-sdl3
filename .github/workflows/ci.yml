name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  JOLT_VERSION: "0.8.10"
  SDL_VERSION: "3.4.16"
  SDL_IMAGE_VERSION: "3.4.6"
  SDL_TTF_VERSION: "3.2.2"
  SDL_MIXER_VERSION: "3.2.4"
  SDL_NET_VERSION: "3.2.0"
  # CI installs every library, so a test that finds one missing fails instead of skipping
  JOLT_SDL3_REQUIRE_SATELLITES: "1"

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Jolt, SDL3 and its companion libraries
        run: brew install jolt-lang/jolt/jolt sdl3 sdl3_image sdl3_ttf sdl3_mixer sdl3_net
      - name: Versions
        run: |
          jolt --version
          brew list --versions sdl3 sdl3_image sdl3_ttf sdl3_mixer sdl3_net
      - name: Test
        run: jolt -M:test

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    env:
      # no display on the runner: SDL's offscreen driver creates windows in memory
      SDL_VIDEO_DRIVER: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies, software Vulkan and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev \
            libpng-dev libjpeg-dev libwebp-dev libtiff-dev \
            fonts-dejavu-core

      - name: Cache SDL3 and its companion libraries
        id: sdl-cache
        uses: actions/cache@v6
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-image-${{ env.SDL_IMAGE_VERSION }}-ttf-${{ env.SDL_TTF_VERSION }}-mixer-${{ env.SDL_MIXER_VERSION }}-net-${{ env.SDL_NET_VERSION }}-ubuntu-24.04-v1

      - name: Build SDL3 and its companion libraries
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          build() {  # build <repo> <tarball-stem> <version> [cmake options...]
            local repo=$1 stem=$2 version=$3; shift 3
            curl -sSL -o "$stem.tar.gz" "https://github.com/libsdl-org/$repo/releases/download/release-$version/$stem-$version.tar.gz"
            tar xzf "$stem.tar.gz"
            cmake -S "$stem-$version" -B "$stem-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" -DCMAKE_PREFIX_PATH="$HOME/sdl3" "$@"
            cmake --build "$stem-build"
            cmake --install "$stem-build"
          }
          build SDL SDL3 "$SDL_VERSION" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF
          # the release tarballs do not carry the vendored libraries: use Ubuntu's
          build SDL_image SDL3_image "$SDL_IMAGE_VERSION" -DSDLIMAGE_VENDORED=OFF -DSDLIMAGE_SAMPLES=OFF \
            -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF
          build SDL_ttf SDL3_ttf "$SDL_TTF_VERSION" -DSDLTTF_VENDORED=OFF -DSDLTTF_SAMPLES=OFF \
            -DSDLTTF_HARFBUZZ=ON -DSDLTTF_PLUTOSVG=OFF
          # codecs whose libraries are absent are left out; WAV, MP3, FLAC and Vorbis are built in
          build SDL_mixer SDL3_mixer "$SDL_MIXER_VERSION" -DSDLMIXER_VENDORED=OFF -DSDLMIXER_SAMPLES=OFF -DSDLMIXER_TESTS=OFF
          build SDL_net SDL3_net "$SDL_NET_VERSION" -DSDLNET_SAMPLES=OFF

      - name: Install Jolt
        run: |
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION" --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test
        run: |
          export LD_LIBRARY_PATH="$HOME/sdl3/lib:${LD_LIBRARY_PATH:-}"
          jolt --version
          jolt -M:test

  windows:
    name: Windows (x64, experimental)
    runs-on: windows-latest
    # untested platform: report results without failing the workflow
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Jolt, SDL3 and its companion libraries
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          $jolt = "jolt-v$env:JOLT_VERSION-x86_64-windows"
          Invoke-WebRequest -Uri "https://github.com/jolt-lang/jolt/releases/download/v$env:JOLT_VERSION/$jolt.zip" -OutFile "$tools\jolt.zip"
          Expand-Archive "$tools\jolt.zip" -DestinationPath $tools
          Add-Content $env:GITHUB_PATH (Join-Path $tools $jolt)

          # each library publishes a zip holding its DLL; put each DLL's folder on PATH
          $libs = @(
            @{ Repo = "SDL";       Name = "SDL3";       Version = $env:SDL_VERSION },
            @{ Repo = "SDL_image"; Name = "SDL3_image"; Version = $env:SDL_IMAGE_VERSION },
            @{ Repo = "SDL_ttf";   Name = "SDL3_ttf";   Version = $env:SDL_TTF_VERSION },
            @{ Repo = "SDL_mixer"; Name = "SDL3_mixer"; Version = $env:SDL_MIXER_VERSION },
            @{ Repo = "SDL_net";   Name = "SDL3_net";   Version = $env:SDL_NET_VERSION }
          )
          foreach ($lib in $libs) {
            $zip = "$tools\$($lib.Name).zip"
            Invoke-WebRequest -Uri "https://github.com/libsdl-org/$($lib.Repo)/releases/download/release-$($lib.Version)/$($lib.Name)-$($lib.Version)-win32-x64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath "$tools\$($lib.Name)"
            $dll = Get-ChildItem -Path "$tools\$($lib.Name)" -Recurse -Filter "$($lib.Name).dll" | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $dll.DirectoryName
            # SDL_image and SDL_mixer load their codecs on demand from an optional folder
            $optional = Join-Path $dll.DirectoryName "optional"
            if (Test-Path $optional) { Add-Content $env:GITHUB_PATH $optional }
          }

      - name: Test
        shell: pwsh
        run: |
          jolt --version
          jolt -M:test
